
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Frog Hacks - Drive Mad</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #101510;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    header {
      position: absolute;
      top: 0;
      width: 100%;
      padding: 18px;
      background: #193c25;
      color: #8dff9c;
      font-size: 24px;
      font-weight: bold;
      letter-spacing: 2px;
    }

    h1 { font-size: 42px; }

    p {
      color: #c7d8c7;
      margin: 0 20px 28px;
    }

    .play {
      display: inline-block;
      padding: 18px 42px;
      border-radius: 10px;
      background: #39d353;
      color: #102016;
      text-decoration: none;
      font-size: 22px;
      font-weight: bold;
    }

    .play:hover { background: #8dff9c; }

    footer {
      position: absolute;
      bottom: 0;
      padding: 12px;
      color: #a9b8a9;
      font-size: 12px;
    }
  </style>
</head>
<body>
  <header>FROG HACKS</header>

  <h1>DRIVE MAD</h1>
  <p>Ready to drive? Click below to play.</p>

  <a class="play"
     href="https://www.drivemad.com/"
     target="_blank"
     rel="noopener noreferrer">
    PLAY DRIVE MAD
  </a>

  <footer>Frog Hacks Gaming</footer>
</body>
</html>
